# PostgreSQL for local BackTrack development.
# Credentials come from .env — nothing is hardcoded here.
services:
  postgres:
    image: postgres:16-alpine
    container_name: backtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-backtrack_dev}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - backtrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits on this rather than sleeping for a fixed time.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-backtrack} -d ${POSTGRES_DB:-backtrack_dev}']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  backtrack-pgdata:
